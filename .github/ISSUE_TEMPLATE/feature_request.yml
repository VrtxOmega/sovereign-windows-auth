name: Feature request
description: Propose an improvement with a concrete use case.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the current obstacle and who encounters it.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the result you want, including recovery expectations if sign-in changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
